name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Deps
        run: flutter pub get

      - name: Build
        run: flutter build apk --release --split-per-abi

      - name: Collect
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/hikari_0.5.0_arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/hikari_0.5.0_armeabi-v7a.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: hikari-apk
          path: out/*.apk
          retention-days: 30
